name: Inspect Current TIE Entry

run-name: Inspecting current TIE appointment system

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Inspect official Extranjeria page
        run: |
          python inspect_tie.py

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tie-site-capture
          path: tie_capture/
          retention-days: 7
