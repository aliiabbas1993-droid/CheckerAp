name: Test TIE ICPPlus Endpoint

run-name: Testing Extranjeria ICPPlus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test endpoints
        run: |
          python test_icpplus.py

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icpplus-test
          path: icpplus_test/
          retention-days: 7
